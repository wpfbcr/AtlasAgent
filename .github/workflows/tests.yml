name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Install CJK font for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
      - run: python -m unittest discover -s tests -v
      - name: Validate CFF CJK export on Linux
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          ATLAS_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python -m unittest discover -s tests -p test_runtime.py -v
